services:
  postgres:
    image: postgres:latest
    env_file:
      - .env
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${DOCKER_DEV_DB}
      POSTGRES_USER: ${DOCKER_DEV_USER}
      POSTGRES_PASSWORD: ${DOCKER_DEV_PWD}
